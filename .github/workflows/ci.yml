name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vecdim
          POSTGRES_PASSWORD: vecdim
          POSTGRES_DB: vecdim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vecdim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # R and the three packages the pipeline's R code uses (the backend runs Rscript itself)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-dplyr r-cran-ggplot2 r-cran-randomforest
      - run: npm ci
      - run: npx tsc --noEmit -p packages/validator
      - run: npx tsc --noEmit -p packages/sync-core
      - run: npx tsc --noEmit -p backend
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://vecdim:vecdim@localhost:5432
      - run: npm run parity
